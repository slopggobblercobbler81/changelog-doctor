[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "changelog-doctor"
version = "1.0.0"
description = "Production Keep-A-Changelog linter, semver bumper, and release notes generator."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "slopggobblercobbler81" }
]
keywords = [
    "changelog",
    "keep-a-changelog",
    "semver",
    "release-notes",
    "linter",
    "github-releases",
    "cli",
    "developer-tools"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Utilities"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]

[project.scripts]
changelog-doctor = "changelog_doctor.cli:main"
chlogdoc = "changelog_doctor.cli:main"

[project.urls]
Homepage = "https://github.com/slopggobblercobbler81/changelog-doctor"
Repository = "https://github.com/slopggobblercobbler81/changelog-doctor"
Issues = "https://github.com/slopggobblercobbler81/changelog-doctor/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.setuptools.packages.find]
where = ["."]
include = ["changelog_doctor*"]
